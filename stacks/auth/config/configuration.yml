server:
  address: "tcp://0.0.0.0:9091"

log:
  level: "info"

theme: "auto"
default_2fa_method: "totp"

identity_validation:
  reset_password:
    jwt_secret: "${AUTHELIA_JWT_SECRET}"

authentication_backend:
  file:
    path: "/config/users_database.yml"
    password:
      algorithm: "argon2id"

access_control:
  default_policy: "two_factor"
  rules:
    - domain: "auth.ocd.beauty"
      policy: "bypass"
    - domain: "*.ocd.beauty"
      policy: "two_factor"

session:
  name: "authelia_session"
  secret: "${AUTHELIA_SESSION_SECRET}"
  expiration: "1h"
  inactivity: "5m"
  cookies:
    - domain: "ocd.beauty"
      authelia_url: "https://auth.ocd.beauty"
      default_redirection_url: "https://ocd.beauty"

regulation:
  max_retries: 3
  find_time: "2m"
  ban_time: "5m"

storage:
  encryption_key: "${AUTHELIA_STORAGE_ENCRYPTION_KEY}"
  local:
    path: "/config/db.sqlite3"

notifier:
  filesystem:
    filename: "/config/notification.txt"
