x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  forgejo:
    <<: *default-logging
    image: codeberg.org/forgejo/forgejo:16.0.5
    container_name: forgejo
    environment:
      - FORGEJO__SERVER__LANDING_PAGE=explore
      - FORGEJO__SERVICE__DISABLE_REGISTRATION=true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/forgejo/data:/data
    restart: unless-stopped
    labels:
      - glance.icon=sh:forgejo-light
      - glance.name=Forgejo
      - glance.url=https://git.ocd.beauty
      - traefik.enable=true
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.routers.forgejo.rule=Host(`git.ocd.beauty`)
      - traefik.http.routers.forgejo.tls.certresolver=letsencrypt
      - traefik.http.services.forgejo.loadbalancer.server.port=3000

networks:
  default:
    external: true
    name: proxy
