x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  photos-postgres:
    <<: *default-logging
    container_name: photos-postgres
    image: postgres:18.6
    restart: unless-stopped
    environment:
      - PGDATA=/var/lib/postgresql/18/data
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - /srv/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d ente_db"]

  photos-garage:
    <<: *default-logging
    container_name: photos-garage
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_DEFAULT_BUCKET=b2-eu-cen
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /srv/garage/meta:/var/lib/garage/meta
      - /srv/garage/data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]

  photos-ente-server:
    <<: *default-logging
    container_name: photos-ente-server
    image: ghcr.io/ente/server:163f45c26f130090abed03649530f53d2d976565
    restart: unless-stopped
    volumes:
      - ./museum.yaml:/museum.yaml:ro
      - ./credentials.yaml:/credentials.yaml:ro
      - /srv/ente-server/data:/data:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
    depends_on:
      - photos-garage
      - photos-postgres

networks:
  default:
    name: proxy
    external: true
