- greeting:
    text_size: xl
    text: Hi!

- datetime:
  locale: en
  format:
    dateStyle: long
    timeStyle: long

- openmeteo:
    label: Kyiv # optional
    latitude: 50.449684
    longitude: 30.525026
    timezone: Europe/Kiev # optional
    units: metric # or imperial
    cache: 5 # Time in minutes to cache API responses, to stay within limits
    format: # optional, Intl.NumberFormat options
      maximumFractionDigits: 1
