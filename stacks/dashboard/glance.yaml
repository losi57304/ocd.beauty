auth:
  secret-key: ${GLANCE_SECRET_KEY}
  users:
    losi57304:
      password: ${GLANCE_PASSWORD}

server:
  proxied: true

theme:
  background-color: 50 1 6
  primary-color: 24 97 58
  negative-color: 209 88 54
  custom-css-file: /assets/styles.css
  contrast-multiplier: 2

pages:
  - name: ocd.beauty
    hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: bookmarks
            groups:
              - links:
                  - title: Gmail
                    url: https://mail.google.com/mail/u/0/
                  - title: Amazon
                    url: https://www.amazon.com/
                  - title: Github
                    url: https://github.com/
                  - title: Wikipedia
                    url: https://en.wikipedia.org/
              - title: Entertainment
                color: 10 70 50
                links:
                  - title: Netflix
                    url: https://www.netflix.com/
                  - title: Disney+
                    url: https://www.disneyplus.com/
                  - title: YouTube
                    url: https://www.youtube.com/
                  - title: Prime Video
                    url: https://www.primevideo.com/
              - title: Social
                color: 200 50 50
                links:
                  - title: Reddit
                    url: https://www.reddit.com/
                  - title: Twitter
                    url: https://twitter.com/
                  - title: Instagram
                    url: https://www.instagram.com/

      - size: full
        widgets:
          - type: html
            source: |
              <div id="greeting-box" style="font-weight: 500; font-size: 1.1rem; padding: 4px 0;"></div>
              <script>
                (function() {
                  const hour = new Date().getHours();
                  let greeting = "Good night!";

                  if (hour >= 6 && hour < 12) {
                    greeting = "Good morning!";
                  } else if (hour >= 12 && hour < 18) {
                    greeting = "Good afternoon!";
                  }

                  const el = document.getElementById("greeting-box");
                  if (el) {
                    el.textContent = greeting;
                  }
                })();
              </script>

          - type: search
            search-engine: google
            autofocus: true

          - type: custom-api
            title: Random Fact
            cache: 3h
            url: https://uselessfacts.jsph.pl/api/v2/facts/random
            template: |
              <p class="size-h4 color-paragraph">{{ .JSON.String "text" }}</p>

          - type: docker-containers
            hide-by-default: false

          - type: videos
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
              - UCsBjURrPoezykLs9EqgamOA # Fireship
              - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
              - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium

      - size: small
        widgets:
          - type: weather
            location: London, United Kingdom
            units: metric
            hour-format: 24h
            hide-location: true

          - type: custom-api
            height: 200px
            title: Random Dog
            cache: 2m
            url: https://dog.ceo/api/breeds/image/random
            template: |
              <img src="{{ .JSON.String "message" }}"></img>

          - type: repository
            repository: losi57304/ocd.beauty
            pull-requests-limit: -1
            issues-limit: -1
            commits-limit: 3
