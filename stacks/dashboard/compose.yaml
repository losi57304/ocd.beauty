x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  glance:
    <<: *default-logging
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/glance/config:/app/config
      - ./glance.yaml:/app/config.glance.yaml

networks:
  default:
    name: proxy
    external: true
