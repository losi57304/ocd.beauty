x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  continuwuity:
    <<: *default-logging
    container_name: continuwuity
    image: forgejo.ellis.link/continuwuation/continuwuity:sha-c6f2c5e-maxperf
    restart: unless-stopped
    command:
      - /sbin/conduwuit
    environment:
      - CONTINUWUITY_ALLOW_REGISTRATION=${CONTINUWUITY_ALLOW_REGISTRATION}
      - CONTINUWUITY_CONFIG=/etc/continuwuity.toml
      - CONTINUWUITY_TURN_SECRET=${CONTINUWUITY_TURN_SECRET}
    volumes:
      - ./continuwuity.toml:/etc/continuwuity.toml:ro
      - /bin/busybox:/busybox:ro
      - /run/continuwuity:/run/continuwuity
      - /srv/continuwuity:/var/lib/continuwuity
    healthcheck:
      test: ["CMD", "/busybox", "test", "-S", "/run/continuwuity/continuwuity.sock"]

  coturn:
    <<: *default-logging
    container_name: coturn
    image: coturn/coturn:4.18.0
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${COTURN_STATIC_AUTH_SECRET}
      - --realm=continuwuity.ocd.beauty
      - --external-ip=${COTURN_EXTERNAL_IP}
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 localhost || exit 1"]

networks:
  default:
    name: proxy
    external: true
