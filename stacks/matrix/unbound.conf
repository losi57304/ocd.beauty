server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    so-reuseport: yes
    outgoing-range: 450
    num-queries-per-thread: 225
    so-rcvbuf: 8m
    so-sndbuf: 8m

    access-control: 127.0.0.1/32 all
    access-control: 10.10.10.0/24 all

    num-threads: 2

    msg-cache-size: 64m
    rrset-cache-size: 128m
    infra-cache-numhosts: 10000
    discard-timeout: 4800

    cache-min-ttl: 60
    cache-max-ttl: 86400
    cache-max-negative-ttl: 300

    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 172800
    serve-expired-client-timeout: 1800

    hide-identity: yes
    hide-version: yes

forward-zone:
    name: "."
    forward-addr: 1.1.1.1@53
    forward-addr: 1.0.0.1@53
    forward-addr: 9.9.9.9@53
