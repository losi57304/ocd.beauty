x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  beszel:
    <<: *default-logging
    container_name: beszel
    image: henrygd/beszel:0.19.0
    restart: unless-stopped
    volumes:
      - /run/beszel:/beszel_socket
      - /srv/beszel/data:/beszel_data
    labels:
      - glance.name=Beszel
      - glance.icon=sh:beszel
      - glance.url=https://monitoring.ocd.beauty

  beszel-agent:
    <<: *default-logging
    container_name: beszel-agent
    image: henrygd/beszel-agent:0.19.0
    restart: unless-stopped
    depends_on:
      - beszel
    environment:
      - HUB_URL=http://beszel:8090
      - KEY=${BESZEL_AGENT_KEY}
      - LISTEN=/beszel_socket/beszel.sock
      - TOKEN=${BESZEL_AGENT_TOKEN}
    volumes:
      - /run/beszel:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  default:
    name: proxy
    external: true
