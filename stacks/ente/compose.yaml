x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  ente-garage:
    <<: *default-logging
    image: dxflrs/garage:v2.4.1
    container_name: ente-garage
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - GARAGE_DEFAULT_BUCKET=b2-eu-cen
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /srv/garage/data:/var/lib/garage/data
      - /srv/garage/meta:/var/lib/garage/meta
    restart: unless-stopped
    labels:
      - glance.name=ente-garage
      - glance.parent=ente-server
      - traefik.enable=true
      - traefik.http.routers.ente-garage.entrypoints=websecure
      - traefik.http.routers.ente-garage.rule=Host(`s3.ente.ocd.beauty`)
      - traefik.http.routers.ente-garage.tls.certresolver=letsencrypt
      - traefik.http.services.ente-garage.loadbalancer.server.port=3900

  ente-postgres:
    <<: *default-logging
    image: postgres:18.6
    container_name: ente-postgres
    environment:
      - PGDATA=/var/lib/postgresql/18/data
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - /srv/postgres:/var/lib/postgresql
    labels:
      - glance.name=ente-postgres
      - glance.parent=ente-server
      - traefik.enable=true
      - traefik.http.routers.ente-postgres.entrypoints=websecure
      - traefik.http.routers.ente-postgres.rule=Host(`database.ente.ocd.beauty`)
      - traefik.http.routers.ente-postgres.tls.certresolver=letsencrypt
      - traefik.http.services.ente-postgres.loadbalancer.server.port=5432

  ente-server:
    <<: *default-logging
    image: ghcr.io/ente/server:163f45c26f130090abed03649530f53d2d976565
    container_name: ente-server
    depends_on:
      - ente-garage
      - ente-postgres
    environment:
      - ENTE_DB_NAME=${POSTGRES_DB}
      - ENTE_DB_PASSWORD=${POSTGRES_PASSWORD}
      - ENTE_DB_USER=${POSTGRES_USER}
      - ENTE_HARDCODED_OTT_LOCAL_DOMAIN_SUFFIX=${ENTE_HARDCODED_OTT_LOCAL_DOMAIN_SUFFIX}
      - ENTE_HARDCODED_OTT_LOCAL_DOMAIN_VALUE=${ENTE_HARDCODED_OTT_LOCAL_DOMAIN_VALUE}
      - ENTE_JWT_SECRET=${ENTE_JWT_SECRET}
      - ENTE_KEY_ENCRYPTION=${ENTE_KEY_ENCRYPTION}
      - ENTE_KEY_HASH=${ENTE_KEY_HASH}
      - ENTE_S3_B2_EU_CEN_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - ENTE_S3_B2_EU_CEN_SECRET=${GARAGE_DEFAULT_SECRET_KEY}
    volumes:
      - ./credentials.yaml:/credentials.yaml:ro
      - /srv/ente-server/data:/data:ro
    restart: unless-stopped
    labels:
      - glance.icon=sh:ente-photos
      - glance.id=ente-server
      - glance.name=Ente
      - traefik.enable=true
      - traefik.http.routers.ente-server.entrypoints=websecure
      - traefik.http.routers.ente-server.rule=Host(`ente.ocd.beauty`)
      - traefik.http.routers.ente-server.tls.certresolver=letsencrypt
      - traefik.http.services.ente-server.loadbalancer.server.port=8080

networks:
  default:
    name: proxy
    external: true
