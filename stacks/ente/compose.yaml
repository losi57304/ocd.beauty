x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  ente-garage:
    <<: *default-logging
    container_name: ente-garage
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_DEFAULT_BUCKET=b2-eu-cen
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /srv/garage/meta:/var/lib/garage/meta
      - /srv/garage/data:/var/lib/garage/data

  ente-postgres:
    <<: *default-logging
    container_name: ente-postgres
    image: postgres:18.6
    restart: unless-stopped
    environment:
      - PGDATA=/var/lib/postgresql/18/data
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - /srv/postgres:/var/lib/postgresql

  ente-server:
    <<: *default-logging
    container_name: ente-server
    image: ghcr.io/ente/server:163f45c26f130090abed03649530f53d2d976565
    restart: unless-stopped
    depends_on:
      - ente-garage
      - ente-postgres
    environment:
      - ENTE_DB_NAME=${POSTGRES_DB}
      - ENTE_DB_USER=${POSTGRES_USER}
      - ENTE_DB_PASSWORD=${POSTGRES_PASSWORD}
      - ENTE_S3_B2_EU_CEN_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - ENTE_S3_B2_EU_CEN_SECRET=${GARAGE_DEFAULT_SECRET_KEY}
      - ENTE_HARDCODED_OTT_LOCAL_DOMAIN_SUFFIX=${ENTE_HARDCODED_OTT_LOCAL_DOMAIN_SUFFIX}
      - ENTE_HARDCODED_OTT_LOCAL_DOMAIN_VALUE=${ENTE_HARDCODED_OTT_LOCAL_DOMAIN_VALUE}
      - ENTE_KEY_ENCRYPTION=${ENTE_KEY_ENCRYPTION}
      - ENTE_KEY_HASH=${ENTE_KEY_HASH}
      - ENTE_JWT_SECRET=${ENTE_JWT_SECRET}
    volumes:
      - ./credentials.yaml:/credentials.yaml:ro
      - /srv/ente-server/data:/data:ro

networks:
  default:
    name: proxy
    external: true
