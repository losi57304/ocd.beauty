auth:
  secret-key: ${GLANCE_AUTH_SECRET_KEY}
  users:
    losi57304:
      password: ${GLANCE_AUTH_PASSWORD}

server:
  proxied: true

theme:
  background-color: 50 1 6
  primary-color: 24 97 58
  negative-color: 209 88 54

pages:
  - name: home.ocd.beauty
    hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

      - size: full
        widgets:
          - type: search
            search-engine: google
            autofocus: true

          - type: custom-api
            title: Random Fact
            cache: 3h
            url: https://uselessfacts.jsph.pl/api/v2/facts/random
            template: |
              <p class="size-h4 color-paragraph">{{ .JSON.String "text" }}</p>

          - type: docker-containers
            hide-by-default: false

          - type: videos
            channels:
              - UCllddADt_Nl4iikd7CHB77w # SimTheNep VGM
              - UCq438-bykwcdis0YKjLoqXw # imago meri
              - UC0tK9G9GMeWQzJJsVjBrEhQ # The House of Kush
              - UCR1ATYyCJML6dxqgQhwIKZg # Cadence Hira

      - size: small
        widgets:
          - type: weather
            location: ${GLANCE_WEATHER_LOCATION}
            units: metric
            hour-format: 24h

          - type: custom-api
            height: 200px
            title: Random Dog
            cache: 2m
            url: https://dog.ceo/api/breeds/image/random
            template: |
              <img src="{{ .JSON.String "message" }}"></img>
