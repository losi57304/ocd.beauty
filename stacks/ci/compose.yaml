x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  woodpecker-ci-server:
    <<: *default-logging
    image: woodpeckerci/woodpecker-server:v3.18.1
    container_name: woodpecker-ci-server
    environment:
      - WOODPECKER_ADMIN=losi57304
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_DEBUG_NOCOLOR=false
      - WOODPECKER_DEBUG_PRETTY=true
      - WOODPECKER_FORGEJO=true
      - WOODPECKER_FORGEJO_CLIENT=${WOODPECKER_FORGEJO_CLIENT}
      - WOODPECKER_FORGEJO_SECRET=${WOODPECKER_FORGEJO_SECRET}
      - WOODPECKER_FORGEJO_URL=https://git.ocd.beauty
      - WOODPECKER_GRPC_SECRET=${WOODPECKER_GRPC_SECRET}
      - WOODPECKER_HOST=https://ci.ocd.beauty
    volumes:
      - /srv/woodpecker-ci/server/data:/var/lib/woodpecker
    restart: unless-stopped
    labels:
      - glance.icon=sh:woodpecker-ci
      - glance.id=woodpecker-ci-server
      - glance.name=Woodpecker CI
      - glance.url=https://ci.ocd.beauty
      - traefik.enable=true
      - traefik.http.routers.woodpecker-ci-server.entrypoints=websecure
      - traefik.http.routers.woodpecker-ci-server.rule=Host(`ci.ocd.beauty`)
      - traefik.http.routers.woodpecker-ci-server.tls.certresolver=letsencrypt
      - traefik.http.services.woodpecker-ci-server.loadbalancer.server.port=8000

  woodpecker-ci-agent:
    <<: *default-logging
    image: woodpeckerci/woodpecker-agent:v3.18.1
    container_name: woodpecker-ci-agent
    depends_on:
      - woodpecker-ci-server
    environment:
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_DEBUG_NOCOLOR=false
      - WOODPECKER_DEBUG_PRETTY=true
      - WOODPECKER_GRPC_SECRET=${WOODPECKER_GRPC_SECRET}
      - WOODPECKER_SERVER=woodpecker-ci-server:9000
    volumes:
      - /srv/woodpecker-ci/agent/config:/etc/woodpecker
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    command:
      - agent
    labels:
      - glance.name=woodpecker-ci-agent
      - glance.parent=woodpecker-ci-server

networks:
  default:
    external: true
    name: proxy
