x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  proxy-caddy:
    <<: *default-logging
    container_name: proxy-caddy
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    extra_hosts:
      - host.docker.gateway:host-gateway
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /run/continuwuity:/run/continuwuity
      - /run/dufs:/run/dufs
      - /srv/caddy/config:/config
      - /srv/caddy/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]

networks:
  default:
    name: proxy
    external: true
