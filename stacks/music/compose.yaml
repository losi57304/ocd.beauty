x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  dufs:
    <<: *default-logging
    image: sigoden/dufs:v0.46.0
    container_name: dufs
    volumes:
      - /srv/navidrome/music:/music
    restart: unless-stopped
    command:
      - --allow-all
      - --auth=${DUFS_USERNAME}:${DUFS_PASSWORD}@/:rw
      - /music
    labels:
      - glance.icon=sh:dufs.png
      - glance.name=Dufs
      - glance.url=https://files.music.ocd.beauty
      - traefik.enable=true
      - traefik.http.routers.dufs.entrypoints=websecure
      - traefik.http.routers.dufs.rule=Host(`files.music.ocd.beauty`)
      - traefik.http.routers.dufs.tls.certresolver=letsencrypt
      - traefik.http.services.dufs.loadbalancer.server.port=5000

  navidrome:
    <<: *default-logging
    image: deluan/navidrome:latest
    container_name: navidrome
    volumes:
      - /srv/navidrome/data:/data
      - /srv/navidrome/music:/music:ro
    restart: unless-stopped
    labels:
      - glance.icon=sh:navidrome-light
      - glance.name=Navidrome
      - glance.url=https://music.ocd.beauty
      - traefik.enable=true
      - traefik.http.routers.gonic.rule=Host(`music.ocd.beauty`)
      - traefik.http.routers.gonic.entrypoints=websecure
      - traefik.http.routers.gonic.tls.certresolver=letsencrypt
      - traefik.http.services.gonic.loadbalancer.server.port=4533

networks:
  default:
    external: true
    name: proxy
