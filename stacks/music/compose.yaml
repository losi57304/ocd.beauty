x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  music-dufs:
    <<: *default-logging
    container_name: music-dufs
    image: sigoden/dufs:v0.46.0
    restart: unless-stopped
    command:
      - --allow-all
      - --auth=${DUFS_USERNAME}:${DUFS_PASSWORD}@/:rw
      - --bind=/run/dufs/dufs.sock
      - /music
    volumes:
      - /run/dufs:/run/dufs
      - /srv/gonic/music:/music
    labels:
      - homepage.group=Services
      - homepage.name=Dufs
      - homepage.href=https://files.music.ocd.beauty
      - homepage.ping=files.music.ocd.beauty
      - homepage.icon=sh-dufs.png

  music-gonic:
    <<: *default-logging
    container_name: music-gonic
    image: sentriz/gonic:8df10c3
    restart: unless-stopped
    environment:
      - GONIC_CACHE_PATH=/cache
      - GONIC_DB_PATH=/data/gonic.db
      - GONIC_MUSIC_PATH=/music
      - GONIC_PLAYLISTS_PATH=/playlists
      - GONIC_PODCAST_PATH=/podcast
    volumes:
      - /srv/gonic/cache:/cache
      - /srv/gonic/data:/data
      - /srv/gonic/music:/music
      - /srv/gonic/playlists:/playlists
      - /srv/gonic/podcast:/podcast
    labels:
      - homepage.group=Services
      - homepage.name=Gonic
      - homepage.href=https://music.ocd.beauty
      - homepage.ping=music.ocd.beauty
      - homepage.icon=sh-gonic.png

networks:
  default:
    name: proxy
    external: true
