x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  dufs:
    <<: *default-logging
    container_name: dufs
    image: sigoden/dufs:v0.46.0
    restart: unless-stopped
    command:
      - --allow-all
      - --auth=${DUFS_USERNAME}:${DUFS_PASSWORD}@/:rw
      - --bind=/run/dufs/dufs.sock
      - /music
    volumes:
      - /run/dufs:/run/dufs
      - /srv/gonic/music:/music
    labels:
      - glance.name=Dufs
      - glance.icon=sh:dufs-light.png
      - glance.url=https://files.music.ocd.beauty

  gonic:
    <<: *default-logging
    container_name: gonic
    image: sentriz/gonic:8df10c3
    restart: unless-stopped
    environment:
      - GONIC_CACHE_PATH=/cache
      - GONIC_DB_PATH=/data/gonic.db
      - GONIC_MUSIC_PATH=/music
      - GONIC_PLAYLISTS_PATH=/playlists
      - GONIC_PODCAST_PATH=/podcast
    volumes:
      - /srv/gonic/cache:/cache
      - /srv/gonic/data:/data
      - /srv/gonic/music:/music
      - /srv/gonic/playlists:/playlists
      - /srv/gonic/podcast:/podcast
    labels:
      - glance.name=Gonic
      - glance.icon=sh:gonic-light.png
      - glance.url=https://music.ocd.beauty

networks:
  default:
    name: proxy
    external: true
