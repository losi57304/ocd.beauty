x-logging: &default-logging
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 10m

services:
  beszel:
    <<: *default-logging
    container_name: beszel
    image: henrygd/beszel:0.19.0
    restart: unless-stopped
    ports:
      - 127.0.0.1:8090:8090
    volumes:
      - /run/beszel:/beszel_socket
      - /srv/beszel/data:/beszel_data

  beszel-agent:
    <<: *default-logging
    container_name: beszel-agent
    image: henrygd/beszel-agent:0.19.0
    restart: unless-stopped
    environment:
      - HUB_URL=http://beszel:8090
      - KEY=${BESZEL_KEY}
      - LISTEN=/beszel_socket/beszel.sock
      - TOKEN=${BESZEL_TOKEN}
    volumes:
      - /run/beszel:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    <<: *default-logging
    container_name: caddy
    image: caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    volumes:
      - /run/continuwuity:/run/continuwuity
      - /run/dufs:/run/dufs
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /srv/caddy/config:/config
      - /srv/caddy/data:/data

  continuwuity:
    <<: *default-logging
    container_name: continuwuity
    image: forgejo.ellis.link/continuwuation/continuwuity:sha-c6f2c5e-maxperf
    restart: unless-stopped
    command:
      - /sbin/conduwuit
    environment:
      - CONTINUWUITY_ALLOW_REGISTRATION=${CONTINUWUITY_ALLOW_REGISTRATION}
      - CONTINUWUITY_CONFIG=/etc/continuwuity.toml
    volumes:
      - /run/continuwuity:/run/continuwuity
      - ./continuwuity.toml:/etc/continuwuity.toml
      - /srv/continuwuity:/var/lib/continuwuity

  dufs:
    <<: *default-logging
    container_name: dufs
    image: sigoden/dufs:v0.46.0
    restart: unless-stopped
    command:
      - -b
      - /run/dufs/dufs.sock
      - -a
      - ${DUFS_USERNAME}:${DUFS_PASSWORD}@/:rw
      - -A
      - /music
    volumes:
      - /run/dufs:/run/dufs
      - /srv/navidrome/music:/music

  gatus:
    <<: *default-logging
    container_name: gatus
    image: twinproduction/gatus:v5.36.0
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./gatus-config.yaml:/config/config.yaml
      - /srv/gatus/data:/data

  gonic:
    <<: *default-logging
    container_name: gonic
    image: sentriz/gonic:8df10c3
    restart: unless-stopped
    environment:
      - GONIC_MUSIC_PATH=/music
      - GONIC_PODCAST_PATH=/podcast
      - GONIC_PLAYLISTS_PATH=/playlists
      - GONIC_CACHE_PATH=/cache
    ports:
      - 127.0.0.1:80:80
    volumes:
      - /srv/gonic/music:/music
      - /srv/gonic/podcast:/podcast
      - /srv/gonic/playlists:/playlists
      - /srv/gonic/cache:/cache

  livekit-server:
    <<: *default-logging
    container_name: livekit-server
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command:
      - --config
      - /etc/livekit.yaml
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"
      - LIVEKIT_NODE=${LIVEKIT_NODE}
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

  lk-jwt-service:
    <<: *default-logging
    container_name: lk-jwt-service
    image: ghcr.io/element-hq/lk-jwt-service:0.7.0
    restart: unless-stopped
    environment:
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=continuwuity.ocd.beauty
      - LIVEKIT_KEY=${LIVEKIT_KEY}
      - LIVEKIT_SECRET=${LIVEKIT_SECRET}
      - LIVEKIT_URL=wss://livekit-server.continuwuity.ocd.beauty
    ports:
      - 127.0.0.1:8081:8080
